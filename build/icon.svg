<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2d36"/>
      <stop offset="1" stop-color="#14151a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4cc38a" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#4cc38a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- tavola: quadrato arrotondato in stile macOS, con margine per l'ombra -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <rect x="102" y="102" width="820" height="820" rx="183" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="4"/>

  <!-- corsia -->
  <line x1="170" y1="512" x2="854" y2="512" stroke="#3d3f4a" stroke-width="12" stroke-linecap="round"/>

  <!-- colpi attesi che scorrono verso l'adesso -->
  <circle cx="250" cy="512" r="66" fill="none" stroke="#ecebe6" stroke-opacity="0.38" stroke-width="32"/>
  <circle cx="774" cy="512" r="66" fill="none" stroke="#ecebe6" stroke-opacity="0.92" stroke-width="32"/>

  <!-- il colpo giusto, in verde, sulla linea dell'adesso -->
  <circle cx="512" cy="512" r="200" fill="url(#glow)"/>
  <circle cx="512" cy="512" r="118" fill="none" stroke="#ecebe6" stroke-width="32"/>

  <!-- linea dell'adesso -->
  <line x1="512" y1="216" x2="512" y2="808" stroke="#f2a541" stroke-width="34" stroke-linecap="round"/>
  <circle cx="512" cy="512" r="74" fill="#4cc38a"/>
</svg>
